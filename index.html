<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    
    <!-- Подключаем Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Подключаем иконки Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- Твои стили -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-sm-10">
                <h2 class="text-center mb-4">To-Do List</h2>
                
                <!-- Блок ввода задачи -->
                <div class="position-relative mb-4">
                    <input type="text" id="taskInput" class="form-control rounded-pill py-2 pe-5 shadow-sm" placeholder="Task" maxlength="28">
                    
                    <button id="addTaskButton" class="btn btn-outline-primary rounded-circle position-absolute top-50 end-0 translate-middle-y me-1 d-flex justify-content-center align-items-center" style="width: 34px; height: 34px; padding: 0;">
                        <i class="bi bi-arrow-right"></i>
                    </button>
                </div>

                <!-- Список задач -->
                <ul id="taskList">
                    <!-- Задачи будут добавляться сюда через JavaScript -->
                </ul>
                
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
